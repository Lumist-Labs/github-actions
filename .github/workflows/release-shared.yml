name: Release (shared)

# Reusable release workflow for Areté consumer repos. Each consumer's
# .github/workflows/release.yml becomes a thin shim that calls this with
# `uses: Lumist-Labs/github-actions/.github/workflows/release-shared.yml@v2`.
#
# Behavior:
#   1. Promote a conventional-commit-style trigger commit if a squash-merge
#      lacks a conventional prefix (or if `major` input is true).
#   2. Run semantic-release to cut a new vX.Y.Z tag + GH Release.
#   3. (Optional) Trigger a follow-up deploy workflow with the new tag.
#
# Consumer repos must have:
#   - `package.json` with semantic-release configured
#   - `main` branch as the release source
#   - (Optional) a `deploy-prod.yml` workflow that accepts a `version` input —
#     skip via `deploy-workflow: ''` if not present.
#
# REQUIRED CALLER PERMISSIONS
# ---------------------------
# The job below requests these permissions. GHA reusable workflows can
# only USE permissions the caller has GRANTED — without this block the
# call fails at startup with "is requesting '...', but is only allowed
# '...'". Copy verbatim into the calling shim (at workflow or job level):
#
#   permissions:
#     contents: write
#     issues: write
#     pull-requests: write
#     actions: write

on:
  workflow_call:
    inputs:
      major:
        description: 'Force major version bump (e.g. 1.x.x → 2.0.0)'
        required: false
        type: boolean
        default: false
      deploy-workflow:
        description: >-
          Workflow file (in the calling repo) to trigger after a successful
          release. Receives the new tag via `version` input. Pass an empty
          string to skip the deploy trigger entirely.
        required: false
        type: string
        default: deploy-prod.yml
      node-version:
        description: 'Node.js version to use for semantic-release.'
        required: false
        type: string
        default: '22'

      runner:
        description: >-
          Runner for this job: a GitHub-hosted image name or a self-hosted
          runner label (e.g. `omarchy`). Self-hosted runners that are already
          tailnet nodes are handled by tailscale-connect's join guard.
        required: false
        type: string
        default: ubuntu-latest

      ci-gated:
        description: >-
          Release only a main SHA that CI has passed. The caller triggers on
          `workflow_run` of its CI workflow (branches: [main]). Trigger commits
          are pushed without [skip ci] so CI runs on them, and the release waits
          for that run's own workflow_run instead of tagging untested code.
          CHANGELOG/git plugins are dropped so the tag lands on the tested SHA.
        required: false
        type: boolean
        default: false
# `cancel-in-progress: false` -- NEVER cancel a release. This job stages a
# commit, pushes to main, waits on CI, then tags via semantic-release; killing
# it partway can leave a staged commit on main with no tag, which is exactly the
# state someone has to unpick by hand. Queueing a second release behind the
# first is correct; racing them is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ !inputs.ci-gated || github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ inputs.runner }}
    # setup-node below supplies node and npm, but npm still writes its cache
    # under $HOME -- and a self-hosted runner's HOME is frequently a directory
    # the runner user cannot create. lumios' own copy of this workflow died on
    # `ENOENT: mkdir '/opt/arete/actions-runner/.npm'` at `npm ci`, before
    # semantic-release ran, so no release could be cut at all. Any consumer
    # passing a self-hosted `runner:` would hit the same wall.
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      npm_config_prefix: ${{ github.workspace }}/.npm-global
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      # main is ruleset-protected and GITHUB_TOKEN can't be exempted, so git pushes
      # (trigger commit, CHANGELOG commit, tag) go out as lumist-release-bot. The
      # checkout-persisted auth header outranks the token semantic-release puts in
      # its push URL, so this covers its pushes too. Its API calls keep
      # GITHUB_TOKEN on purpose: a Release created by the App would fire
      # `release: published` in deploy-prod on top of the dispatch below.
      # Orgs without the App (aretecp) fall back to GITHUB_TOKEN, which works only
      # where main doesn't block it; that was every caller's path before #137.
      - id: bot
        if: vars.RELEASE_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Say which identity pushes
        if: vars.RELEASE_BOT_APP_ID == ''
        run: echo "::notice::RELEASE_BOT_APP_ID is not set for this repo; release pushes go out as GITHUB_TOKEN, not lumist-release-bot."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token || github.token }}
          # workflow_run checks out the default branch otherwise, which is develop.
          ref: ${{ inputs.ci-gated && 'main' || '' }}

      - name: Verify CI tested this exact main SHA
        if: inputs.ci-gated && github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "::error::main moved after CI tested $TESTED_SHA; the newer SHA releases on its own CI run." >&2
            exit 1
          fi

      - name: Gated releases come from CI, not dispatch
        if: inputs.ci-gated && github.event_name != 'workflow_run' && !inputs.major
        run: |
          echo "::error::ci-gated releases run from CI's workflow_run; dispatch only stages a forced major." >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci

      - name: Promote squash-merge commit type
        id: promote
        env:
          MAJOR_BUMP: ${{ inputs.major }}
          CI_GATED: ${{ inputs.ci-gated }}
        run: |
          # Ungated: [skip ci] keeps the trigger commit from re-running CI, and it
          # releases in this run. Gated: CI must run on it, and its workflow_run
          # does the release -- this run stops after pushing.
          SKIP=" [skip ci]"; [[ "$CI_GATED" == "true" ]] && SKIP=""
          push_trigger() {
            git push origin main
            [[ "$CI_GATED" == "true" ]] && echo "deferred=true" >> "$GITHUB_OUTPUT"
            return 0
          }

          # Manual major bump via workflow_dispatch input
          if [[ "$MAJOR_BUMP" == "true" ]]; then
            echo "Manual major bump requested"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "feat: major release${SKIP}" -m "BREAKING CHANGE: manual major version bump" --no-verify
            push_trigger
            exit 0
          fi

          # Squash-merged develop→main PRs have subjects like "Develop (#N)"
          # with conventional commit lines in the body. Semantic-release only
          # reads the subject, so we add a new empty commit with the
          # highest-priority type found in the body as a conventional prefix.
          # Cannot amend — semantic-release rejects when local diverges from
          # remote.
          SUBJECT=$(git log -1 --format="%s")
          if echo "$SUBJECT" | grep -qE "^(feat|fix|chore|refactor|perf|docs|test)"; then
            echo "Subject already has conventional prefix — skipping"
            exit 0
          fi

          BODY=$(git log -1 --format="%b")

          # Check for breaking changes first (highest priority → major bump)
          IS_BREAKING=false
          if echo "$BODY" | grep -qiE "BREAKING CHANGE|^\* feat!:|^\* fix!:"; then
            IS_BREAKING=true
          fi

          if echo "$BODY" | grep -qE "^\* feat"; then
            TYPE="feat"
          elif echo "$BODY" | grep -qE "^\* fix"; then
            TYPE="fix"
          elif echo "$BODY" | grep -qE "^\* refactor"; then
            TYPE="refactor"
          elif echo "$BODY" | grep -qE "^\* perf"; then
            TYPE="perf"
          else
            echo "No conventional commits found in body — skipping (no release this push)"
            exit 0
          fi

          MSG="${TYPE}: ${SUBJECT}"
          BREAKING_FOOTER=""
          if [[ "$IS_BREAKING" == "true" ]]; then
            BREAKING_FOOTER="BREAKING CHANGE: breaking changes detected in squash-merge body"
          fi
          echo "Adding release trigger commit: $MSG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$BREAKING_FOOTER" ]]; then
            git commit --allow-empty -m "${MSG}${SKIP}" -m "$BREAKING_FOOTER" --no-verify
          else
            git commit --allow-empty -m "${MSG}${SKIP}" --no-verify
          fi
          push_trigger

      - name: Get current tags at HEAD
        # Snapshot by tag *name*, not `git describe` (which walks ancestry
        # and can report an unrelated older tag reachable from HEAD even
        # when nothing new was tagged). Comparing points-at-HEAD tag sets
        # before/after this job identifies a genuinely new tag even if a
        # stray tag happens to already point at the pre-run HEAD.
        if: steps.promote.outputs.deferred != 'true'
        id: before
        run: echo "tags=$(git tag --points-at HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: semrel
        # A GitHub Release publish failure (e.g. the release-notes cap below
        # still being exceeded, or a transient API error) must not stop this
        # job before the deploy dispatch further down: semantic-release's
        # core creates and pushes the vX.Y.Z tag before any publish plugin
        # runs, so the tag (and thus the release this push earned) already
        # exists even when `npx semantic-release` exits non-zero. See #854.
        continue-on-error: true
        if: steps.promote.outputs.deferred != 'true'
        env:
          CI_GATED: ${{ inputs.ci-gated }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Single config rewrite: strip changelog/git for ci-gated releases
          # (an untested CHANGELOG commit would otherwise get tagged), and
          # cap @semantic-release/github's release body at 120,000 characters
          # -- GitHub's Releases API rejects bodies over 125,000, which bit
          # us on a first-ever-release-style push with ~1,000 commits (#854
          # in vector). @semantic-release/github has no dedicated truncation
          # option (semantic-release/github#622), but `releaseBodyTemplate`
          # is a documented Lodash template (default
          # `<%= nextRelease.notes %>`): https://github.com/semantic-release/github#options
          # Skip entirely -- no error -- if the consumer doesn't configure
          # plugins via a `.releaserc.json` array (e.g. via `package.json`'s
          # `release` key or a `.js`/`.yml` config instead).
          if [[ -f .releaserc.json ]] && jq -e '.plugins | type == "array"' .releaserc.json >/dev/null 2>&1; then
            TEMPLATE='<%= (function(n){var limit=120000;if(n.length<=limit)return n;var cut=n.lastIndexOf("\n",limit);if(cut<0)cut=limit;if(/[\uD800-\uDBFF]$/.test(n.slice(0,cut)))cut--;return n.slice(0,cut)+"\n\n---\n\n*Release notes truncated at "+limit+" characters -- see CHANGELOG.md for the complete history.*";})(nextRelease.notes||"") %>'
            GATED_ARG=false; [[ "$CI_GATED" == "true" ]] && GATED_ARG=true
            jq --arg t "$TEMPLATE" --argjson gated "$GATED_ARG" '
              (if $gated then
                .plugins |= map(select((if type == "array" then .[0] else . end)
                  | IN("@semantic-release/changelog", "@semantic-release/git") | not))
              else . end)
              | .plugins |= map(
                  if (if type == "array" then .[0] else . end) == "@semantic-release/github"
                  then (
                    if type == "array"
                    then [.[0], ((.[1] // {}) + {releaseBodyTemplate: (.[1].releaseBodyTemplate // $t)})]
                    else [., {releaseBodyTemplate: $t}]
                    end
                  )
                  else .
                  end
                )
            ' .releaserc.json > "$RUNNER_TEMP/releaserc.json"
            mv "$RUNNER_TEMP/releaserc.json" .releaserc.json
          else
            echo "No .releaserc.json with a plugins array -- skipping release-notes cap$( [[ "$CI_GATED" == "true" ]] && echo " and ci-gated plugin strip")."
          fi
          npx semantic-release

      - name: Determine new tag
        # HEAD may have moved (promote's trigger commit, semantic-release's
        # own CHANGELOG commit), so compare points-at-HEAD tag *names*
        # before/after rather than `git describe`. A name only counts as new
        # if it's also on origin: a local `git tag` whose push failed (or a
        # release that died before reaching the push) must not trigger a
        # deploy for a tag the deploy-target workflow can't check out.
        if: steps.promote.outputs.deferred != 'true'
        id: after
        env:
          BEFORE_TAGS: ${{ steps.before.outputs.tags }}
        run: |
          NEW_TAG=""
          for t in $(git tag --points-at HEAD); do
            case " $BEFORE_TAGS " in
              *" $t "*) ;;
              *) NEW_TAG="$t" ;;
            esac
          done

          if [[ -z "$NEW_TAG" ]]; then
            echo "tag=none" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; then
            echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag $NEW_TAG was created locally but is not on origin (push may have failed) -- treating as no new release." >&2
            echo "tag=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production deploy if new release
        if: inputs.deploy-workflow != '' && steps.promote.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
          NEW_TAG: ${{ steps.after.outputs.tag }}
        run: |
          if [[ "$NEW_TAG" == "none" ]]; then
            echo "No new tag -- skipping deploy"
            exit 0
          fi

          echo "New tag: $NEW_TAG -- triggering $DEPLOY_WORKFLOW"
          # --ref main: without it the run lands on the repo's default branch, which
          # is develop in most repos, and `production` only deploys from main or v*.
          gh workflow run "$DEPLOY_WORKFLOW" --ref main -f version="$NEW_TAG"

      - name: Fail if semantic-release itself failed
        # The deploy dispatch above already ran (or correctly skipped) against
        # whatever tag exists. Fail now, after that dispatch, so the run still
        # shows red and the publish error (GitHub Release, npm, etc.) is not
        # silently swallowed by `continue-on-error` on the step above.
        if: steps.semrel.outcome == 'failure'
        run: |
          echo "::error::semantic-release failed -- see the 'Run semantic-release' step above for the actual error. A new tag may have been created and deploy may already have been dispatched for it; this failure is about the publish step itself (e.g. GitHub Release creation), not about whether a release happened. See https://github.com/Lumist-Labs/vector/issues/854." >&2
          exit 1
