name: Slack Notify
description: >-
  Post a Block Kit card to a Slack channel via chat.postMessage: context line,
  linked title with a button, one-line summary and a facts grid in a coloured
  attachment. Long detail can follow as replies in the card's thread.

# Token comes via `env: SLACK_BOT_TOKEN`, not an input (CONTRIBUTING.md); generic name so any app's bot token fits.

inputs:
  channel:
    description: Channel ID to post to (C…), not the channel name. The ID survives a channel rename.
    required: true

  title:
    description: >-
      Card title, rendered bold and linked to `button-url` when set. Also the
      notification preview text. Lead with the outcome.
    required: true

  summary:
    description: Optional one sentence shown under the title.
    required: false
    default: ''

  context:
    description: >-
      Optional small grey line above the title, Slack mrkdwn. Defaults to
      repo · run · branch · actor of the calling workflow.
    required: false
    default: ''

  text:
    description: >-
      Optional body text under the summary. Slack mrkdwn; the two common
      Markdown forms callers already use with teams-notify — **bold** and
      [label](url) — are converted. Prefer `summary` + `thread-text`.
    required: false
    default: ''

  status:
    description: >-
      Semantic status controlling the colour bar.
      One of `info`, `success`, `warning`, `failure`.
    required: false
    default: info

  facts:
    description: >-
      Optional JSON array of {"name","value"} objects rendered as a two-column
      field grid. Example: '[{"name":"App","value":"arilearn"}]'
    required: false
    default: '[]'

  button-url:
    description: Optional URL for the button beside the title. The title links here too.
    required: false
    default: ''

  button-label:
    description: Label for the button when `button-url` is set.
    required: false
    default: View

  button-style:
    description: Button colour. `primary` (green), `danger` (red), or empty for Slack's default.
    required: false
    default: ''

  thread-text:
    description: >-
      Optional long text posted as replies in the card's thread right after
      the card. Same mrkdwn conversion as `text`. Split across as many replies
      as needed, never truncated.
    required: false
    default: ''

  thread-ts:
    description: >-
      Optional `ts` of an existing message. The card (and any `thread-text`
      replies) is posted into that message's thread instead of the channel.
    required: false
    default: ''

  username:
    description: Optional sender name shown on the message (e.g. "Houston · Deploys"). Needs the chat:write.customize scope.
    required: false
    default: ''

  icon-emoji:
    description: Optional sender icon as an emoji code (e.g. ":rocket:"). Needs the chat:write.customize scope.
    required: false
    default: ''

  dry-run:
    description: >-
      Build and print the payload without posting. Lets smoke tests exercise
      payload construction without spamming a real channel.
    required: false
    default: 'false'

outputs:
  payload:
    description: The JSON payload of the card that was sent (or would have been, under dry-run).
    value: ${{ steps.post.outputs.payload }}
  thread-payloads:
    description: >-
      JSON array of the `thread-text` reply payloads, `[]` without
      `thread-text`. `thread_ts` is added at post time, so it is absent here.
    value: ${{ steps.post.outputs.thread-payloads }}
  ts:
    description: Timestamp of the posted card, for threading replies or chat.update. Empty under dry-run.
    value: ${{ steps.post.outputs.ts }}

runs:
  using: composite
  steps:
    - name: Post message to Slack
      id: post
      shell: bash
      env:
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_TEXT: ${{ inputs.text }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_FACTS: ${{ inputs.facts }}
        INPUT_BUTTON_URL: ${{ inputs.button-url }}
        INPUT_BUTTON_LABEL: ${{ inputs.button-label }}
        INPUT_BUTTON_STYLE: ${{ inputs.button-style }}
        INPUT_THREAD_TEXT: ${{ inputs.thread-text }}
        INPUT_THREAD_TS: ${{ inputs.thread-ts }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_ICON_EMOJI: ${{ inputs.icon-emoji }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail

        # info is the Lumist iris; the other three match teams-notify.
        case "$INPUT_STATUS" in
          info)    COLOR='#6957D8' ;;
          success) COLOR='#2EA043' ;;
          warning) COLOR='#D29922' ;;
          failure) COLOR='#B60205' ;;
          *)
            echo "::error::status must be one of info|success|warning|failure (got '${INPUT_STATUS}')"
            exit 1
            ;;
        esac

        case "$INPUT_BUTTON_STYLE" in
          ''|primary|danger) ;;
          *)
            echo "::error::button-style must be primary, danger or empty (got '${INPUT_BUTTON_STYLE}')"
            exit 1
            ;;
        esac

        if [ -z "$INPUT_CHANNEL" ]; then
          echo "::error::channel is required (a channel ID like C0123456789)"
          exit 1
        fi

        # Slack rejects an empty section as invalid_blocks, which reads as a mystery ok:false.
        if [ -z "${INPUT_TITLE//[[:space:]]/}" ]; then
          echo "::error::title must be non-empty"
          exit 1
        fi

        if ! printf '%s' "$INPUT_FACTS" | jq -e 'type == "array"' >/dev/null 2>&1; then
          echo "::error::facts must be a JSON array of {name,value} objects"
          exit 1
        fi

        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # Escape before link conversion, or the <url|label> it emits gets escaped too.
        # Card fields are clipped to Slack's caps; thread text is chunked instead, because
        # the thread is where the complete version lives.
        BUILT=$(jq -n \
          --arg channel "$INPUT_CHANNEL" \
          --arg title "$INPUT_TITLE" \
          --arg summary "$INPUT_SUMMARY" \
          --arg context "$INPUT_CONTEXT" \
          --arg text "$INPUT_TEXT" \
          --arg color "$COLOR" \
          --argjson facts "$INPUT_FACTS" \
          --arg url "$INPUT_BUTTON_URL" \
          --arg label "$INPUT_BUTTON_LABEL" \
          --arg style "$INPUT_BUTTON_STYLE" \
          --arg thread_text "$INPUT_THREAD_TEXT" \
          --arg thread_ts "$INPUT_THREAD_TS" \
          --arg username "$INPUT_USERNAME" \
          --arg icon "$INPUT_ICON_EMOJI" \
          --arg repo "$GITHUB_REPOSITORY" \
          --arg repo_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --arg run_url "$RUN_URL" \
          --arg run_number "$GITHUB_RUN_NUMBER" \
          --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
          --arg actor "$GITHUB_ACTOR" \
          '
          def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
          def mrkdwn:
            esc
            | gsub("\\*\\*(?<b>[^*]+)\\*\\*"; "*\(.b)*")
            | gsub("\\[(?<l>[^\\]]+)\\]\\((?<u>[^)\\s]+)\\)"; "<\(.u)|\(.l)>");
          def clip($n): if length > $n then .[0:$n-1] + "…" else . end;

          # Thread chunking: whole lines first; a line too long for one section is split
          # between tokens so an &amp; entity or a <url|label> link is never cut in half.
          def hard($n): if length > $n then [range(0; length; $n) as $i | .[$i:$i+$n]] else [.] end;
          def pack($n; $sep):
            reduce .[] as $p ([];
              if length == 0 then [$p]
              elif ((.[length-1] + $sep + $p) | length) <= $n then .[length-1] += $sep + $p
              else . + [$p] end);
          def chunks($n):
            split("\n")
            | map(if length <= $n then [.]
                  else [match("&(?:amp|lt|gt);|<[^<>]*>|\\s+|[^\\s&<]+|[&<]"; "g").string | hard($n)[]] | pack($n; "")
                  end)
            | flatten
            | pack($n; "\n")
            | map(select(test("\\S")));

          (if $context != "" then $context | mrkdwn
           else "<\($repo_url)|\($repo | esc)> · <\($run_url)|run #\($run_number)> · \($branch | esc) · \($actor | esc)"
           end) as $ctx
          | (if $url != "" then "*<\($url)|\($title | clip(150) | esc)>*" else "*\($title | clip(150) | esc)*" end) as $heading
          | ({}
             + (if $thread_ts != "" then { thread_ts: $thread_ts } else {} end)
             + (if $username != "" then { username: $username } else {} end)
             + (if $icon != "" then { icon_emoji: $icon } else {} end)) as $sender
          | {
              card: ({
                channel: $channel,
                text: ($title | esc),
                unfurl_links: false,
                unfurl_media: false,
                attachments: [{
                  color: $color,
                  blocks: (
                    [{ type: "context", elements: [{ type: "mrkdwn", text: ($ctx | clip(3000)) }] }]
                    + [{ type: "section",
                         text: { type: "mrkdwn",
                                 text: ($heading + (if $summary != "" then "\n" + ($summary | clip(2000) | mrkdwn) else "" end)) } }
                       + (if $url != "" then
                            { accessory: ({ type: "button", text: { type: "plain_text", text: ($label | clip(75)) }, url: $url }
                                          + (if $style != "" then { style: $style } else {} end)) }
                          else {} end)]
                    + (if ($text | test("\\S")) then
                         [{ type: "section", text: { type: "mrkdwn", text: ($text | mrkdwn | clip(3000)) } }]
                       else [] end)
                    + [ $facts as $f | range(0; $f | length; 10) as $i
                        | { type: "section",
                            fields: [ $f[$i:$i+10][]
                                      | { type: "mrkdwn",
                                          text: ("*\(.name | tostring | esc)*\n\(.value | tostring | mrkdwn)" | clip(2000)) } ] } ]
                  )
                }]
              } + $sender),
              replies: [ $thread_text | mrkdwn | chunks(2900)[]
                         | { channel: $channel, text: ., unfurl_links: false, unfurl_media: false,
                             blocks: [{ type: "section", text: { type: "mrkdwn", text: . } }] }
                           + ($sender | del(.thread_ts)) ]
            }
          ')

        PAYLOAD=$(printf '%s' "$BUILT" | jq -c '.card')
        REPLIES=$(printf '%s' "$BUILT" | jq -c '.replies')

        {
          echo 'payload<<PAYLOAD_EOF'
          printf '%s\n' "$PAYLOAD"
          echo 'PAYLOAD_EOF'
          echo "thread-payloads=${REPLIES}"
        } >> "$GITHUB_OUTPUT"

        if [ "$INPUT_DRY_RUN" = "true" ]; then
          echo "dry-run — not posting. Card payload:"
          printf '%s\n' "$PAYLOAD" | jq .
          echo "Thread replies: $(printf '%s' "$REPLIES" | jq 'length')"
          printf '%s\n' "$REPLIES" | jq '.[] | {chars: (.text | length), text}'
          echo "ts=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
          echo "::error::SLACK_BOT_TOKEN env var is required (pass it via env: at the call site, not as an input)"
          exit 1
        fi

        BODY_FILE=$(mktemp)
        HEADERS_FILE=$(mktemp)
        RESP_FILE=$(mktemp)

        # Token goes in via stdin config so it never appears in argv (`ps` on shared runners).
        post() {
          printf 'header = "Authorization: Bearer %s"\n' "$SLACK_BOT_TOKEN" \
            | curl -sS --max-time 30 -K - \
                -H 'Content-Type: application/json; charset=utf-8' \
                --data-binary @"$BODY_FILE" -D "$HEADERS_FILE" -o "$RESP_FILE" -w '%{http_code}' \
                https://slack.com/api/chat.postMessage
        }

        # Posts stdin as one message; leaves Slack's response in $RESP_FILE.
        send() {
          cat > "$BODY_FILE"
          local code delay
          code=$(post)
          if [ "$code" = "429" ]; then
            delay=$(awk 'tolower($1) == "retry-after:" { print $2 + 0 }' "$HEADERS_FILE")
            delay=${delay:-5}
            if [ "$delay" -gt 30 ]; then delay=30; fi
            echo "::warning::Slack rate-limited the $1; retrying once in ${delay}s"
            sleep "$delay"
            code=$(post)
          fi

          # Slack returns HTTP 200 + {"ok": false} for bad token/channel/scope, so curl -f can't catch it.
          if ! jq -e '.ok == true' "$RESP_FILE" >/dev/null 2>&1; then
            local error
            error=$(jq -r '.error // "unparseable response"' "$RESP_FILE" 2>/dev/null || echo "unparseable response")
            echo "::error::Slack rejected the $1 (HTTP ${code}): ${error}"
            exit 1
          fi
        }

        printf '%s' "$PAYLOAD" | send card
        TS=$(jq -r '.ts' "$RESP_FILE")
        echo "ts=${TS}" >> "$GITHUB_OUTPUT"
        echo "Posted card to Slack."

        COUNT=$(printf '%s' "$REPLIES" | jq 'length')
        [ "$COUNT" -eq 0 ] && exit 0

        # Slack threads are one level deep, so replies to a card that is itself a reply
        # go in the same parent thread.
        PARENT="${INPUT_THREAD_TS:-$TS}"
        for i in $(seq 0 $((COUNT - 1))); do
          printf '%s' "$REPLIES" | jq -c --argjson i "$i" --arg ts "$PARENT" '.[$i] + { thread_ts: $ts }' \
            | send "thread reply $((i + 1))/${COUNT}"
        done
        echo "Posted ${COUNT} thread repl$([ "$COUNT" -eq 1 ] && echo y || echo ies)."
